version: '3.8'

services:
  configsvr:
    image: mongo:latest
    container_name: configsvr
    command: >
      mongod --configsvr --replSet configReplSet
             --port 27018
             --dbpath /data/configdb
             --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - ./data/configdb:/data/configdb
      - ./init:/init
    restart: unless-stopped

  #------Config du principal_a------------------#
  principal_a:
    image: mongo:latest
    container_name: principal_a
    command: >
      mongod --shardsvr --replSet principal_a
             --port 27019
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - ./data/principal_a-principal_a:/data/db
    restart: unless-stopped

  secondaire_a_1:
    image: mongo:latest
    container_name: secondaire_a_1
    command: >
      mongod --shardsvr --replSet principal_a
             --port 27020
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27020:27020"
    volumes:
      - ./data/principal_a-secondaire_a_1:/data/db
    restart: unless-stopped

  secondaire_a_2:
    image: mongo:latest
    container_name: secondaire_a_2
    command: >
      mongod --shardsvr --replSet principal_a
             --port 27021
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27021:27021"
    volumes:
      - ./data/principal_a-secondaire_a_2:/data/db
    restart: unless-stopped

  secondaire_a_3:
    image: mongo:latest
    container_name: secondaire_a_3
    command: >
      mongod --shardsvr --replSet principal_a
             --port 27022
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27022:27022"
    volumes:
      - ./data/principal_a-secondaire_a_3:/data/db
    restart: unless-stopped

    #------fin de vConfig du principal_a------------------#



  #------Config du principal_b------------------#
  principal_b:
    image: mongo:latest
    container_name: principal_b
    command: >
      mongod --shardsvr --replSet principal_b
             --port 27023
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27023:27023"
    volumes:
      - ./data/principal_b-principal_b:/data/db
    restart: unless-stopped

  secondaire_b_1:
    image: mongo:latest
    container_name: secondaire_b_1
    command: >
      mongod --shardsvr --replSet principal_b
             --port 27024
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27024:27024"
    volumes:
      - ./data/principal_b-secondaire_b_1:/data/db
    restart: unless-stopped

  secondaire_b_2:
    image: mongo:latest
    container_name: secondaire_b_2
    command: >
      mongod --shardsvr --replSet principal_b
             --port 27025
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27025:27025"
    volumes:
      - ./data/principal_b-secondaire_b_2:/data/db
    restart: unless-stopped

  secondaire_b_3:
    image: mongo:latest
    container_name: secondaire_b_3
    command: >
      mongod --shardsvr --replSet principal_b
             --port 27026
             --dbpath /data/db
             --bind_ip_all
    ports:
      - "27026:27026"
    volumes:
      - ./data/principal_b-secondaire_b_3:/data/db
    restart: unless-stopped

    #------Fin de Config du principal_b------------------#

  #Congig routeur
  mongos:
    image: mongo:latest
    container_name: mongos
    depends_on:
      - configsvr
      - principal_a
      - principal_b
    command: >
      bash -c "sleep 10 && 
      mongosh --host configsvr --port 27018 /init/init-replica.js &&
      mongosh --host principal_a --port 27019 /init/init-shard.js &&
      mongosh --host principal_b --port 27023 /init/init-shard.js
      mongos --configdb configReplSet/configsvr:27018 --bind_ip_all --port 27017 &
      sleep 10 &&
      mongosh --host localhost --port 27017 /init/init-router.js &&
      tail -f /dev/null
      "
    ports:
      - "27017:27017"
    volumes:
      - ./init:/init
    restart: unless-stopped
